<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q1 Drill</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
    body {
      background-color: lightblue;
      padding-top: 40px;
    }
    .my-title {
      background-color: white;
      border: 2px solid black;
      border-radius: 20px;
      padding: 10px;
      text-align: center;
      margin-bottom: 40px;
    }
    .my-card {
      background-color: white;
      border: 1px solid gray;
      padding: 15px;
      min-height: 250px;
      border-radius: 5px;
    }
    .yellow-tag {
      background-color: #f7d04a;
      padding: 5px;
      margin-bottom: 10px;
      border: 1px solid black;
    }
    ul {
      padding-left: 20px;
    }
  </style>

</head>


<body>
<div class="container">
    
    <div class="row">
      <div class="col-12">
        <div class="my-title">
          <h2>Beginner's Guide to Pickleball</h2>
        </div>
      </div>
    </div>

    <div style="text-align: center;">
    	<img src="PBlogo.png" width="300">
    </div>
    
    <div class="row">
      
      <div class="col-4">
        <div class="my-card">
          <div class="yellow-tag">Basic Rules</div>
          <ul>
            <li>Serve diagonally</li>
            <li>Double bounce rule</li>
            <li>No volley zone</li>
            <li>Scoring</li>
          </ul>
        </div>
      </div>
      
      <div class="col-4">
        <div class="my-card">
          <div class="yellow-tag">Pickleball Equipment</div>
          <ul>
            <li>Paddle</li>
            <li>Plastic ball</li>
            <li>Net</li>
            <li>Court</li>
          </ul>
        </div>
      </div>
      
      <div class="col-4">
        <div class="my-card">
          <div class="yellow-tag">Basic Techniques</div>
          <ul>
            <li>Forehand and backhand strokes</li>
            <li>Serving techniques</li>
            <li>Dinking</li>
            <li>Positioning</li>
          </ul>
        </div>
      </div>
      
    </div>

  </div>
</body>
</html>
